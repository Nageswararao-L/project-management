server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's internal DNS. Looking the api container up per request (via the
  # variable below) keeps working after it restarts and gets a new IP address;
  # a plain `proxy_pass http://api:3000` would keep the old one and return 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  # API (and its Swagger docs at /api/docs) is served by the api container.
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change, so they can be cached for a long time.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: unknown paths (e.g. /projects/3) load index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
